apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: python-app-secrets
spec:
  provider: azure
  secretObjects:
    - secretName: sql-app-secrets
      type: Opaque
      data:
        - objectName: SQL_USERNAME
          key: SQL_USERNAME
        - objectName: SQL_PASSWORD
          key: SQL_PASSWORD
        - objectName: APP_SECRET
          key: APP_SECRET
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.keyVault.secretsProviderClientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: SQL-USERNAME
          objectAlias: SQL_USERNAME
          objectType: secret
        - |
          objectName: SQL-PASSWORD
          objectAlias: SQL_PASSWORD
          objectType: secret
        - |
          objectName: APP-SECRET
          objectAlias: APP_SECRET
          objectType: secret