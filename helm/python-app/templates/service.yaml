
apiVersion: v1
kind: Service
metadata:
  name: python-app
  labels:
    app: python-app
  annotations:
    service.beta.kubernetes.io/azure-dns-label-name: {{ .Values.service.dnsLabel | quote }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: python-app
  ports:
    - port: {{ .Values.service.port }}
      name: http
      targetPort: {{ .Values.containerPort }}
